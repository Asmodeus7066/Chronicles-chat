<!DOCTYPE html>
<html>
<head>
  <title>Chronicle</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<div id="overlay">
  <div id="loginBox">

    <img src="assets/logo.png" class="logo">

    <input id="username" placeholder="Username">

    <input id="avatar" placeholder="Avatar Image URL">

    <button onclick="enterChat()">
      Enter Chronicle
    </button>

  </div>
</div>
<div id="charCreator" style="display:none;">
    <h2>Character Sheet</h2>

    <h3>Attributes</h3>
    <div id="attributes"></div>

    <h3>Skills</h3>
    <div id="skills"></div>

    <button onclick="saveCharacterSheet()">Save Character</button>
</div>
<div id="chatContainer">

  <div id="header">
    CHRONICLE ARCHIVE
    <button onclick="enterDMMode()">DM Login</button>
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input id="messageInput" placeholder="Write...">

    <button onclick="sendMessage()">
      Send
    </button>
  </div>

</div>

<!-- 🔥 DM CONTROL PANEL (only visible in DM mode) -->
<div id="dmPanel">
    <div class="dm-title">DM PANEL</div>

    <button onclick="setUsernameForMessage()">
        Change Username
    </button>

    <button onclick="wipeAllMessages()">
        Wipe All Messages
    </button>

    <button onclick="toggleDMMode()">
        Exit DM Mode
    </button>
    <button onclick="toggleHauntAngr()">
        Haunt-ANGR
    </button>
</div>

<script src="app.js"></script>

</body>
</html>
