<!DOCTYPE html>
<html>
<head>
  <title>Chronicle</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<!-- LOGIN -->
<div id="overlay">
  <div id="loginBox">

    <img src="assets/logo.png" class="logo">

    <input id="username" placeholder="Username">
    <input id="avatar" placeholder="Avatar Image URL">

    <button onclick="enterChat()">
      Enter Chronicle
    </button>

  </div>
</div>

<!-- CHARACTER CREATOR -->
<div id="charCreator" style="display:none;">
    <h2>Character Sheet</h2>

    <h3>Attributes</h3>
    <div id="attributes"></div>

    <h3>Skills</h3>
    <div id="skills"></div>

    <h3>Derived Traits</h3>
    <div id="derived"></div>

    <!-- FIX: this function now exists as calculateDerivedTraits() -->
    <button onclick="calculateDerivedTraits(); openCharacterCreator();">
        Recalculate Derived Traits
    </button>

    <h3>Other</h3>
    <div id="otherStats"></div>

    <button onclick="saveCharacterSheet()">
        Save Character
    </button>
</div>

<!-- CHAT -->
<div id="chatContainer">

  <div id="header">
    CHRONICLE ARCHIVE
    <button onclick="enterDMMode()">DM Login</button>
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input id="messageInput" placeholder="Write...">

    <button onclick="sendMessage()">
      Send
    </button>
  </div>

</div>

<!-- DM PANEL -->
<div id="dmPanel">
    <div class="dm-title">DM PANEL</div>

    <button onclick="setUsernameForMessage()">Change Username</button>

    <button onclick="toggleHauntAngr()">Haunt-ANGR</button>

    <button onclick="wipeAllMessages()">Wipe All Messages</button>

    <button onclick="toggleDMMode()">Exit DM Mode</button>

    <hr>

    <div class="dm-title">Characters</div>
    <div id="characterList"></div>

    <div id="characterInspect"></div>
</div>

<script src="app.js"></script>

<div id="sheetPanel">
    <div id="sheetHeader">
        <strong>Your Character</strong>
        <button onclick="toggleSheet()">✕</button>
    </div>

    <div id="sheetContent"></div>
</div>

<button id="openSheetBtn" onclick="toggleSheet()">
    Character Sheet
</button>
  
</body>
</html>
